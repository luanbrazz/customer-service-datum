server:
  port: 8080

spring:
  application:
    name: customer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: true
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    users:
      - username: user
        password: ${APP_USER_PASSWORD:user123}
        role: USER
      - username: admin
        password: ${APP_ADMIN_PASSWORD:admin123}
        role: ADMIN

  score-service:
    base-url: ${SCORE_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${SCORE_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SCORE_SERVICE_READ_TIMEOUT_MS:3000}