spring:
  application:
    name: customer-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  security:
    users:
      - username: user
        password: ${APP_USER_PASSWORD:user123}
        role: USER
      - username: admin
        password: ${APP_ADMIN_PASSWORD:admin123}
        role: ADMIN

  score-service:
    base-url: ${SCORE_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${SCORE_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SCORE_SERVICE_READ_TIMEOUT_MS:3000}

resilience4j:
  circuitbreaker:
    instances:
      scoreService:
        sliding-window-size: 5 # Quantidade de chamadas consideradas para calcular a taxa de falhas
        minimum-number-of-calls: 3 # Número mínimo de chamadas antes de começar a calcular a taxa de falhas
        failure-rate-threshold: 50 # Abre o circuito quando a taxa de falhas atingir 50%
        wait-duration-in-open-state: 10s # Tempo que o circuito permanece aberto antes de permitir chamadas de teste
        permitted-number-of-calls-in-half-open-state: 2 # Quantidade de chamadas de teste permitidas no estado HALF_OPEN